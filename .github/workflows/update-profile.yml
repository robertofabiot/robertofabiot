name: Update Profile (Snake & Live Rank %)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Calculate Live Top % in Nicaragua
        run: |
          mkdir -p dist
          PAGE=$(curl -sL https://committers.top/nicaragua)
          TOTAL=$(echo "$PAGE" | grep -oP 'There are \K[0-9]+' || echo "3132")
          RANK=$(curl -sL https://committers.top/rank_only/nicaragua.json | jq -r '.user | index("robertofabiot") + 1')
          
          if [ "$RANK" != "null" ] && [ -n "$RANK" ] && [ "$RANK" -gt 0 ] 2>/dev/null; then
            PCT=$(awk "BEGIN {printf \"%.1f\", ($RANK / $TOTAL) * 100}")
            MSG="Top ${PCT}% (#${RANK} of ${TOTAL})"
          else
            MSG="Top 0.8% (#25 of 3132)"
          fi

          cat <<EOF > dist/top-percent.json
          {
            "schemaVersion": 1,
            "label": "Nicaragua GitHub",
            "message": "$MSG",
            "color": "2ea44f",
            "namedLogo": "github"
          }
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
