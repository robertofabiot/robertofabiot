name: Update Profile (Snake & Live Rank %)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Generate Live Top % Badge SVG
        run: |
          mkdir -p dist
          PAGE=$(curl -sL https://committers.top/nicaragua)
          TOTAL=$(echo "$PAGE" | grep -oP 'There are \K[0-9]+' || echo "3132")
          RANK=$(curl -sL https://committers.top/rank_only/nicaragua.json | jq -r '.user | index("robertofabiot") + 1')
          
          if [ "$RANK" != "null" ] && [ -n "$RANK" ] && [ "$RANK" -gt 0 ] 2>/dev/null; then
            PCT=$(awk "BEGIN {printf \"%.1f\", ($RANK / $TOTAL) * 100}")
            MSG="Top_${PCT}%25_(%23${RANK}_of_${TOTAL})"
          else
            MSG="Top_0.8%25_(%2325_of_3132)"
          fi

          curl -sL "https://img.shields.io/badge/Nicaragua_GitHub-${MSG}-2ea44f?logo=github&logoColor=white" -o dist/top-percent.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
